apiVersion: v1
kind: Service
metadata:
  name: prometheus-lb
  namespace: monitoring
  annotations:
    metallb.io/allow-shared-ip: "monitoring-ip"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.242
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus-kube-prometheus-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090