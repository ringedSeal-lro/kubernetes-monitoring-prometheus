apiVersion: v1
kind: Service
metadata:
  name: grafana-lb
  namespace: monitoring
  annotations:
    metallb.io/allow-shared-ip: "monitoring-ip"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.242
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: prometheus
  ports:
    - name: http
      port: 8080
      targetPort: 3000